# Default values for PodPulse.

image:
  registry: ghcr.io
  # Matches the GHCR namespace the publish-images workflow pushes to
  # (.github/workflows/publish-images.yml uses ${{ github.repository_owner }}).
  # If you fork the repo, point this at your own org/user before installing.
  repository: avnshrai/podpulse
  # CI pushes :latest and :sha-<short>. We default to :latest so a plain
  # `helm install` Just Works. Pin to :sha-<short> in production via
  # --set image.tag=sha-abcdef0 for immutability.
  tag: latest
  pullPolicy: IfNotPresent

detector:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  service:
    grpcPort: 9090
    httpPort: 8080

tailer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Path on the node where the kubelet writes pod logs in CRI format.
  logsHostPath: /var/log/pods
  # When true, the tailer skips real CRI log reading and instead emits
  # a synthetic stable-baseline + bad-rollout pattern so you can see
  # the detector fire end-to-end without instrumenting any workload.
  demo: false
  demoBreakAfter: "45s"
  extraArgs: []

postgres:
  # When true, deploy a single-replica Postgres StatefulSet alongside
  # the detector. Persists onboarded users, registered clusters, and
  # per-request /k8s-proxy audit log. Auto-generates a password on
  # first install.
  enabled: false
  # Override the auto-generated password. When empty, a random 32-char
  # password is generated once and reused on subsequent helm upgrades.
  password: ""
  # External Postgres connection string. Used when postgres.enabled=false
  # AND postgres.dsn is non-empty. Example:
  #   postgres://podpulse:secret@postgres:5432/podpulse?sslmode=disable
  dsn: ""
  image: "postgres:16-alpine"
  storage: "1Gi"
  storageClass: ""  # cluster default
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

clickhouse:
  # External ClickHouse DSN. Required.
  # Example: clickhouse://default:@clickhouse:9000/podpulse
  dsn: ""

alerts:
  slack:
    webhook: ""        # Slack incoming webhook URL
  teams:
    webhook: ""        # MS Teams Power Automate Workflow webhook
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
  pagerduty:
    routingKey: ""

# Templates-only by default. Set to true to additionally store a short
# rolling buffer of raw log lines for currently-anomalous templates.
storeRawAnomalousLogs: false

# Optional local LLM for richer RCA phrasing. Off by default; nothing
# leaves the cluster unless explicitly configured.
llm:
  enabled: false
  endpoint: ""         # e.g. http://ollama.podpulse.svc:11434/v1
  model: "llama3"

# Read ArgoCD / Flux CRDs to enrich RCA with GitOps context. Requires the
# CRDs to exist; the chart adds RBAC for them only if enabled.
gitops:
  argocd: false
  flux: false

# GitHub Actions correlation. Optional; needs a PAT with workflow:read.
githubActions:
  enabled: false
  tokenSecretName: ""

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
