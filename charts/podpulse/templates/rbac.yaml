{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podpulse.fullname" . }}
  labels:
    {{- include "podpulse.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
      - namespaces
      - nodes
      - configmaps
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
  # User-onboarding writes (creates ServiceAccount + Role + RoleBinding,
  # mints short-lived tokens via TokenRequest).
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    # 'escalate' + 'bind' are required by K8s privilege-escalation guards
    # so PodPulse can create Roles granting verbs it does not itself
    # hold cluster-wide. Without these, the apiserver rejects role
    # creation with: "attempting to grant RBAC permissions not currently
    # held". Standard pattern for RBAC-management tools.
    verbs: ["get", "list", "watch", "create", "update", "delete", "escalate", "bind"]
{{- if .Values.gitops.argocd }}
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if .Values.gitops.flux }}
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podpulse.fullname" . }}
  labels:
    {{- include "podpulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podpulse.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "podpulse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
