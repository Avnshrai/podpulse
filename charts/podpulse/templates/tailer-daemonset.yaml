apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "podpulse.fullname" . }}-tailer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: tailer
spec:
  selector:
    matchLabels:
      {{- include "podpulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tailer
  template:
    metadata:
      labels:
        {{- include "podpulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tailer
    spec:
      serviceAccountName: {{ include "podpulse.serviceAccountName" . }}
      tolerations:
        - operator: Exists
      {{- if not .Values.tailer.demo }}
      securityContext:
        # /var/log/pods is root:root mode 0750 on AKS/containerd nodes,
        # so the tailer must run as root to traverse it.
        runAsUser: 0
        runAsGroup: 0
      {{- end }}
      containers:
        - name: tailer
          image: {{ include "podpulse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pp-tailer"]
          args:
            - --detector=$(DETECTOR_URL)
            {{- if not .Values.tailer.demo }}
            - --logs-dir={{ .Values.tailer.logsHostPath }}
            {{- end }}
            {{- if .Values.tailer.demo }}
            - --demo
            - --demo-break-after={{ .Values.tailer.demoBreakAfter | default "45s" }}
            {{- end }}
            {{- range .Values.tailer.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DETECTOR_URL
              value: "https://{{ include "podpulse.fullname" . }}-detector.{{ .Release.Namespace }}.svc:{{ .Values.detector.service.httpPort }}"
          resources:
            {{- toYaml .Values.tailer.resources | nindent 12 }}
          {{- if not .Values.tailer.demo }}
          volumeMounts:
            - name: pod-logs
              mountPath: {{ .Values.tailer.logsHostPath }}
              readOnly: true
          {{- end }}
      {{- if not .Values.tailer.demo }}
      volumes:
        - name: pod-logs
          hostPath:
            path: {{ .Values.tailer.logsHostPath }}
      {{- end }}
