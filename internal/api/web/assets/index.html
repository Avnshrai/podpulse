<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PodPulse</title>
<style>
  /* ============================================================
     PodPulse — Neon-inspired two-app shell.
     One workspace, two apps: Incidents / Admin.
     ============================================================ */
  :root {
    --bg:        #0a0a0b;
    --panel:     #0f0f11;
    --panel-2:   #14141a;
    --panel-3:   #18181f;
    --border:    #1f1f25;
    --border-2:  #2a2a32;
    --text:      #ededee;
    --muted:     #9095a0;
    --muted-2:   #5e6370;
    --accent:    #4fb87a;
    --accent-2:  #5b9dff;
    --critical:  #f87171;
    --high:      #fb923c;
    --medium:    #facc15;
    --low:       #4ade80;
    --radius:    6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "topbar topbar"
      "side main";
    height: 100vh;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    grid-area: topbar;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 18px;
    background: var(--bg);
    gap: 6px;
  }
  .logo {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--bg);
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
    flex: 0 0 auto;
  }
  .crumb-sep { color: var(--muted-2); margin: 0 6px; }
  .crumb {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .crumb:hover { background: var(--panel-2); }
  .crumb .plan {
    background: var(--panel-2);
    color: var(--muted);
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 4px;
    border: 1px solid var(--border-2);
  }
  .crumb svg { width: 12px; height: 12px; opacity: .55; }

  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .pill-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--border-2);
    border-radius: 18px;
    font-size: 12px; color: var(--muted);
  }
  .pill-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(79,184,122,.55);
    animation: pulse 2s ease-out infinite;
  }
  .pill-status.warn .dot { background: var(--high); animation: none; }
  .pill-status.crit .dot { background: var(--critical); animation: none; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(79,184,122,.45); }
    50%     { box-shadow: 0 0 0 6px rgba(79,184,122,0); }
  }
  .icon-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    color: var(--muted); border-radius: 6px;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); }
  .topbar .upgrade {
    background: var(--text); color: var(--bg);
    padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--text);
    font-size: 12px; font-weight: 500;
  }
  .topbar .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--panel-3);
    border: 1px solid var(--border-2);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600; color: var(--text);
    margin-left: 4px;
  }

  /* ---------- SIDEBAR ---------- */
  .side {
    grid-area: side;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
    padding: 14px 8px 12px;
  }
  .side-section {
    font-size: 10.5px; color: var(--muted-2);
    text-transform: uppercase; letter-spacing: .08em;
    padding: 12px 10px 6px;
    font-weight: 500;
  }
  .side-section:first-child { padding-top: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    border-radius: 5px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 1px;
  }
  .nav-item:hover { color: var(--text); background: var(--panel-2); }
  .nav-item.active {
    color: var(--text);
    background: var(--panel-2);
  }
  .nav-item .ic { width: 14px; height: 14px; opacity: .7; flex: 0 0 auto; }
  .nav-item.active .ic { opacity: 1; }
  .nav-item .badge {
    margin-left: auto;
    color: var(--muted-2); font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .nav-item.active .badge { color: var(--muted); }

  .branch-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    border: 1px solid var(--border-2);
    border-radius: 6px;
    margin: 6px 4px 8px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text);
  }
  .branch-pill:hover { background: var(--panel-2); }
  .branch-pill svg { width: 12px; height: 12px; margin-left: auto; opacity: .55; }

  .side-foot {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    color: var(--muted-2);
  }
  .side-foot .nav-item { color: var(--muted-2); font-size: 12px; }

  /* ---------- MAIN ---------- */
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 22px 28px 60px;
  }
  .page-head {
    display: flex; align-items: center;
    margin-bottom: 22px;
  }
  .page-head h1 {
    margin: 0;
    font-size: 22px; letter-spacing: -0.02em;
    font-weight: 600;
  }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--border-2);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
  }
  .btn:hover { border-color: var(--muted-2); background: var(--panel-2); }
  .btn.primary {
    background: var(--text); color: var(--bg); border-color: var(--text);
  }
  .btn.primary:hover { background: #fff; }
  .btn.danger { color: var(--critical); border-color: rgba(248,113,113,.35); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--panel-2); color: var(--text); }
  .btn svg { width: 13px; height: 13px; }

  /* Stat / connect cards (Neon top-row pattern) */
  .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .grid-card h4 {
    margin: 0 0 4px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .grid-card h4 .ic { width: 14px; height: 14px; color: var(--muted); }
  .grid-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

  .pcard {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .pcard h2 {
    margin: 0 0 4px; font-size: 14px; font-weight: 600;
  }
  .pcard .sub {
    color: var(--muted-2); font-size: 12px; margin-bottom: 14px;
  }

  /* Big stat row (like "Branches 1/10") */
  .big-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .big-stat {
    padding: 16px 20px;
    border-right: 1px solid var(--border);
  }
  .big-stat:last-child { border-right: 0; }
  .big-stat .l { color: var(--muted); font-size: 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .big-stat .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .big-stat .v .of { color: var(--muted-2); font-size: 18px; font-weight: 500; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-2); font-weight: 500; }
  td { color: var(--muted); }
  td strong { color: var(--text); font-weight: 500; }

  /* Severity dots / pills */
  .sevdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
  .sevdot.critical { background: var(--critical); }
  .sevdot.high { background: var(--high); }
  .sevdot.medium { background: var(--medium); }
  .sevdot.low { background: var(--low); }

  /* Issue card (incidents app) */
  .a-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .a-card.sev-low      { border-left: 2px solid var(--low); }
  .a-card.sev-medium   { border-left: 2px solid var(--medium); }
  .a-card.sev-high     { border-left: 2px solid var(--high); }
  .a-card.sev-critical { border-left: 2px solid var(--critical); }

  .a-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .a-tag { color: var(--muted-2); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 500; }
  .a-path { color: var(--muted); font-family: ui-monospace, monospace; font-size: 11.5px; }
  .a-sev { margin-left: auto; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
  .a-card.sev-low .a-sev      { color: var(--low); }
  .a-card.sev-medium .a-sev   { color: var(--medium); }
  .a-card.sev-high .a-sev     { color: var(--high); }
  .a-card.sev-critical .a-sev { color: var(--critical); }

  .h-tier1 { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .h-tier2 { color: var(--muted); margin-top: 2px; font-size: 12.5px; }
  .a-story { color: var(--muted); margin-top: 8px; font-size: 12.5px; }

  .a-confidence {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
    font-size: 11.5px; color: var(--muted);
  }
  .a-confidence .bar { flex: 1; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .a-confidence .bar > div { height: 100%; background: var(--accent-2); }
  .a-confidence strong { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 500; }

  .a-actions { display: flex; gap: 6px; margin-top: 14px; }

  /* Severity tabs (incidents page) */
  .tabs {
    display: flex; align-items: center; gap: 18px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px; margin-bottom: 18px;
  }
  .tab {
    color: var(--muted); cursor: pointer;
    padding-bottom: 8px; margin-bottom: -10px;
    border-bottom: 1px solid transparent;
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-color: var(--text); }
  .tab .num { color: var(--muted-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  /* Forms (clusters / users onboarding) */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .form-grid.full { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--muted-2); }
  .field input, .field select, .field textarea {
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font: inherit;
  }
  .field textarea { resize: vertical; min-height: 120px; font-family: ui-monospace, monospace; font-size: 12px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent-2); }

  /* Empty / loading */
  .empty { padding: 60px 0; text-align: center; color: var(--muted-2); font-size: 12.5px; }

  /* Modal */
  .modal-shade { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 60; display: grid; place-items: center; padding: 24px; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 22px 24px;
    max-width: 720px; width: 100%; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .modal .cmd {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px;
    font-family: ui-monospace, monospace; font-size: 12px; color: var(--text);
    margin: 8px 0; word-break: break-all; white-space: pre-wrap;
  }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--panel); border: 1px solid var(--border-2);
    padding: 8px 14px; border-radius: 6px;
    font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    z-index: 100;
  }

  /* Severity color helpers */
  .imp-label { font-size: 11px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; }
  .imp-label.low  { color: var(--low); }
  .imp-label.med  { color: var(--medium); }
  .imp-label.high { color: var(--high); }
  .imp-label.crit { color: var(--critical); }

  .row-line {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .row-line:last-child { border-bottom: 0; }
  .row-line .meta { color: var(--muted); font-size: 11.5px; }

  /* Cluster card (admin app) */
  .cluster-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 18px; margin-bottom: 8px;
    display: grid; grid-template-columns: 1fr 200px 220px auto; gap: 14px; align-items: center;
  }
  .cluster-card .name { font-weight: 500; }
  .cluster-card .meta { color: var(--muted-2); font-size: 11.5px; }

  /* Audit table tweaks */
  .audit-row {
    display: grid; grid-template-columns: 80px 110px 70px 1fr 70px;
    gap: 12px; padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px; align-items: start;
  }

  /* What changed timeline */
  .tl-row {
    display: grid; grid-template-columns: 80px 80px 1fr;
    gap: 12px; padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }

  /* Help banners (Neon-style "Get connected") */
  .info-banner {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 18px;
    position: relative;
  }
  .info-banner h3 {
    margin: 0 0 14px;
    font-size: 14px; font-weight: 500;
    display: flex; align-items: center;
  }
  .info-banner h3 .dismiss {
    margin-left: auto; color: var(--muted-2); cursor: pointer;
    font-size: 12px;
  }
  .info-banner h3 .dismiss:hover { color: var(--text); }

  /* Steps modal style for kubeconfig */
  .step-line {
    display: grid; grid-template-columns: 22px 1fr; gap: 10px;
    margin-bottom: 10px;
  }
  .step-num {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    color: var(--muted);
    font-size: 11px; font-weight: 500;
    display: grid; place-items: center;
  }
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo">P</div>
    <div class="crumb">
      <span>PodPulse</span>
      <span class="plan">Free</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 9l4-4 4 4M16 15l-4 4-4-4"/></svg>
    </div>
    <span class="crumb-sep">/</span>
    <div class="crumb" id="cluster-picker" style="position:relative">
      <span id="cluster-picker-label">in-cluster</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 9l4-4 4 4M16 15l-4 4-4-4"/></svg>
      <div id="cluster-menu" style="display:none;position:absolute;top:32px;left:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px;min-width:240px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.5)"></div>
    </div>

    <div class="right">
      <div class="pill-status" id="status-pill"><span class="dot"></span><span id="status-text">All OK</span></div>
      <div class="icon-btn" title="Help">?</div>
      <div class="avatar">A</div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="side">
    <div class="side-section">App</div>
    <a class="nav-item active" data-app="incidents">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 22h20L12 2zM12 9v5M12 18h.01"/></svg>
      Incidents
      <span class="badge" id="nav-issues-count"></span>
    </a>
    <a class="nav-item" data-app="admin">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2.1-1.6-2-3.4-2.5.9a7 7 0 00-1.7-1L14 3h-4l-.8 2.5a7 7 0 00-1.7 1l-2.5-.9-2 3.4L5.1 11a7 7 0 000 2L3 14.6l2 3.4 2.5-.9c.5.4 1.1.7 1.7 1L10 21h4l.8-2.5a7 7 0 001.7-1l2.5.9 2-3.4-2.1-1.6c.1-.3.1-.7.1-1z"/></svg>
      Admin &amp; Audit
    </a>

    <div id="incidents-nav">
      <div class="side-section">Incidents</div>
      <a class="nav-item active" data-route="overview">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
        Overview
      </a>
      <a class="nav-item" data-route="issues">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Issues
      </a>
      <a class="nav-item" data-route="changes">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h12"/></svg>
        What changed
      </a>
      <a class="nav-item" data-route="workloads">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
        Workloads
      </a>
      <a class="nav-item" data-route="deployments">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18l7-5 7 5V3z"/></svg>
        Deployments
      </a>
      <a class="nav-item" data-route="services">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>
        Services
      </a>
    </div>

    <div id="admin-nav" style="display:none">
      <div class="side-section">Admin</div>
      <a class="nav-item active" data-route="clusters">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18"/></svg>
        Clusters
      </a>
      <a class="nav-item" data-route="users">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Users
      </a>
      <a class="nav-item" data-route="audit">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v6H3zM3 15h18v6H3zM7 6h.01M7 18h.01"/></svg>
        Audit log
      </a>
      <a class="nav-item" data-route="channels">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Channels
      </a>
      <a class="nav-item" data-route="settings">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2.1-1.6-2-3.4-2.5.9a7 7 0 00-1.7-1L14 3h-4l-.8 2.5a7 7 0 00-1.7 1l-2.5-.9-2 3.4L5.1 11a7 7 0 000 2L3 14.6l2 3.4 2.5-.9c.5.4 1.1.7 1.7 1L10 21h4l.8-2.5a7 7 0 001.7-1l2.5.9 2-3.4-2.1-1.6c.1-.3.1-.7.1-1z"/></svg>
        Settings
      </a>
    </div>

    <div class="side-foot">
      <a class="nav-item" href="https://github.com/Avnshrai/podpulse" target="_blank">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.13c-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.95.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.27-5.24-5.65 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.16 1.18a11 11 0 015.74 0c2.2-1.49 3.16-1.18 3.16-1.18.62 1.57.23 2.73.11 3.02.74.8 1.18 1.82 1.18 3.07 0 4.39-2.69 5.36-5.25 5.64.41.36.78 1.06.78 2.13v3.16c0 .31.21.68.8.56C20.21 21.39 23.5 17.08 23.5 12c0-6.35-5.15-11.5-11.5-11.5z"/></svg>
        Open on GitHub
      </a>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script type="module">
  // ----- helpers -----
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtTime = d => new Date(d).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const fmtAgo = d => {
    const ms = Date.now() - new Date(d).getTime();
    if (ms < 60_000) return 'a few seconds ago';
    const m = Math.floor(ms/60_000);
    if (m < 60) return m + ' min ago';
    const h = Math.floor(m/60);
    return h + ' hr ago';
  };
  const sevColor = s => ({critical:'critical',high:'high',medium:'medium',low:'low'})[s] || 'medium';
  const wlPath = w => `${w.namespace || '?'} / ${w.kind || '?'} / ${w.name || '?'}`;

  function toast(msg) {
    const t = el('div','toast', escapeHTML(msg));
    document.body.append(t);
    setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(() => t.remove(), 300); }, 2200);
  }

  // ----- API -----
  const api = {
    summary:    () => fetch('/v1/summary').then(r => r.json()),
    issues:     q => fetch('/v1/issues?' + new URLSearchParams(q||{})).then(r => r.json()),
    issue:      id => fetch('/v1/issues/' + encodeURIComponent(id)).then(r => r.json()),
    issueState: (id, action) => fetch(`/v1/issues/${encodeURIComponent(id)}/${action}`, {method:'POST'}).then(r => r.json()),
    timeline:   q => fetch('/v1/timeline?' + new URLSearchParams(q||{})).then(r => r.json()),
    workloads:  () => fetch('/v1/workloads').then(r => r.json()),
    services:   () => fetch('/v1/services').then(r => r.json()),
    deployments:() => fetch('/v1/deployments').then(r => r.json()),
    audit:      q => fetch('/v1/audit?' + new URLSearchParams(q||{})).then(r => r.json()),
    auditActors:() => fetch('/v1/audit/actors').then(r => r.json()),
    listUsers:  () => fetch(activeCluster ? `/v1/clusters/${activeCluster}/users` : '/v1/users').then(r => r.json()),
    createUser: body => fetch(activeCluster ? `/v1/clusters/${activeCluster}/users` : '/v1/users',
      {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
      .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); }),
    deleteUser: name => fetch(activeCluster ? `/v1/clusters/${activeCluster}/users/${encodeURIComponent(name)}` : `/v1/users/${encodeURIComponent(name)}`,
      {method:'DELETE'}),
    userKubeURL: name => activeCluster ? `/v1/clusters/${activeCluster}/users/${encodeURIComponent(name)}/kubeconfig`
                                       : `/v1/users/${encodeURIComponent(name)}/kubeconfig`,
    listClusters: () => fetch('/v1/clusters').then(r => r.json()),
    registerCluster: body => fetch('/v1/clusters', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); }),
    deleteCluster: id => fetch('/v1/clusters/' + encodeURIComponent(id), {method:'DELETE'}),
    channels:   () => fetch('/v1/channels').then(r => r.json()),
  };

  // ----- App / route state -----
  let activeApp = 'incidents';      // 'incidents' | 'admin'
  let activeRoute = 'overview';
  let activeSeverity = '';
  let lastSummary = null;
  let activeCluster = '';           // empty = in-cluster default
  let knownClusters = [];           // populated from /v1/clusters

  const incidentRoutes = { overview: renderOverview, issues: renderIssues, changes: renderChanges, workloads: renderWorkloads, deployments: renderDeployments, services: renderServices };
  const adminRoutes = { clusters: renderClusters, users: renderUsers, audit: renderAudit, channels: renderChannels, settings: renderSettings };
  const titles = {
    overview:'Overview', issues:'Issues', changes:'What changed',
    workloads:'Workloads', deployments:'Deployments', services:'Services',
    clusters:'Clusters', users:'Users', audit:'Audit log', channels:'Channels', settings:'Settings',
  };
  const staticPages = new Set(['users','settings','channels','audit','clusters']);

  // App switcher
  $$('[data-app]').forEach(n => n.addEventListener('click', e => {
    e.preventDefault();
    switchApp(n.dataset.app);
  }));

  // Route switcher
  $$('[data-route]').forEach(n => n.addEventListener('click', e => {
    e.preventDefault();
    navigate(n.dataset.route);
  }));

  function switchApp(app) {
    activeApp = app;
    // Highlight app entry
    $$('[data-app]').forEach(n => n.classList.toggle('active', n.dataset.app === app));
    // Toggle nav blocks
    $('#incidents-nav').style.display = app === 'incidents' ? '' : 'none';
    $('#admin-nav').style.display = app === 'admin' ? '' : 'none';
    // Default landing per app
    activeRoute = (app === 'incidents') ? 'overview' : 'clusters';
    $$('[data-route]').forEach(n => n.classList.toggle('active', n.dataset.route === activeRoute));
    rerender();
  }

  function navigate(r) {
    activeRoute = r;
    $$('[data-route]').forEach(n => n.classList.toggle('active', n.dataset.route === r));
    rerender();
  }

  // Tick + smart re-render gating
  let lastSig = null;
  async function tick() {
    try {
      const sum = await api.summary();
      lastSummary = sum;
      // status pill
      const pill = $('#status-pill'), st = $('#status-text');
      pill.classList.remove('warn','crit');
      if (sum.high_risk_count > 0) { pill.classList.add('crit'); st.textContent = `${sum.high_risk_count} high-risk`; }
      else if (sum.total > 0)      { pill.classList.add('warn'); st.textContent = `${sum.total} issues`; }
      else                         { st.textContent = 'All OK'; }
      const navN = $('#nav-issues-count');
      if (navN) navN.textContent = sum.total || '';
    } catch(e) {
      $('#status-text').textContent = 'detector unreachable';
    }
    if (staticPages.has(activeRoute)) return;
    const sig = activeApp + '|' + activeRoute + '|' + activeSeverity + '|' +
      (lastSummary ? `${lastSummary.total}:${(lastSummary.by_severity||{}).high||0}:${(lastSummary.by_severity||{}).critical||0}` : '');
    if (sig !== lastSig) {
      lastSig = sig;
      rerender();
    }
  }
  async function rerender() {
    try {
      const routes = activeApp === 'incidents' ? incidentRoutes : adminRoutes;
      const fn = routes[activeRoute] || routes[Object.keys(routes)[0]];
      await fn();
    } catch (e) {
      $('#main').innerHTML = `<div class="empty">Error: ${escapeHTML(e.message)}</div>`;
    }
  }

  tick();
  setInterval(tick, 5000);
  refreshClusterPicker();
  setInterval(refreshClusterPicker, 30_000);

  // Cluster picker dropdown
  const picker = $('#cluster-picker');
  const menu = $('#cluster-menu');
  picker.addEventListener('click', e => {
    e.stopPropagation();
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  });
  document.addEventListener('click', () => { menu.style.display = 'none'; });

  async function refreshClusterPicker() {
    try {
      const data = await api.listClusters();
      knownClusters = data.clusters || [];
      menu.innerHTML = '';
      const inCluster = el('div','nav-item' + (activeCluster===''?' active':''),'in-cluster <span class="meta" style="margin-left:auto;font-size:11px;color:var(--muted-2)">default</span>');
      inCluster.style.padding = '7px 10px';
      inCluster.onclick = () => { activeCluster=''; setClusterLabel(); menu.style.display='none'; lastSig=null; rerender(); };
      menu.append(inCluster);
      knownClusters.forEach(c => {
        const it = el('div','nav-item' + (activeCluster===c.id?' active':''), escapeHTML(c.name));
        it.style.padding = '7px 10px';
        it.onclick = () => { activeCluster=c.id; setClusterLabel(); menu.style.display='none'; lastSig=null; rerender(); };
        menu.append(it);
      });
      setClusterLabel();
    } catch(e) {/*silent*/}
  }
  function setClusterLabel() {
    const lbl = $('#cluster-picker-label');
    if (!activeCluster) { lbl.textContent = 'in-cluster'; return; }
    const c = knownClusters.find(c => c.id === activeCluster);
    lbl.textContent = c ? c.name : activeCluster.slice(0,8);
  }

  // -------------- INCIDENTS APP PAGES --------------

  async function renderOverview() {
    const sum = lastSummary || await api.summary();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Overview', [['View on GitHub', 'https://github.com/Avnshrai/podpulse', false]]));

    // Welcome banner (Neon-style)
    const banner = el('div','info-banner');
    banner.innerHTML = `
      <h3>PodPulse incidents <span class="dismiss" onclick="this.parentElement.parentElement.remove()">Dismiss</span></h3>
      <div class="card-grid">
        <div class="grid-card"><h4><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Issues</h4><p>One ranked feed of log anomalies, ConfigMap diffs, and K8s events. The decision-shaped view.</p></div>
        <div class="grid-card"><h4><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h12"/></svg> What changed</h4><p>Chronological list of every deploy, configmap edit, and observed issue across the cluster.</p></div>
        <div class="grid-card"><h4><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/></svg> Workloads</h4><p>Every Deployment / StatefulSet / DaemonSet in the cluster with anomaly counts.</p></div>
        <div class="grid-card"><h4><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18l7-5 7 5V3z"/></svg> Deployments</h4><p>Recent rollouts, with the "did this deploy break something?" badge.</p></div>
      </div>`;
    m.append(banner);

    // Big stats
    const sev = sum.by_severity || {};
    const stats = el('div','big-stats');
    stats.innerHTML = `
      <div class="big-stat"><div class="l">Total <i>(last 6h)</i></div><div class="v">${sum.total||0}</div></div>
      <div class="big-stat"><div class="l">High-risk</div><div class="v" style="color:var(--high)">${sev.high||0}</div></div>
      <div class="big-stat"><div class="l">Critical</div><div class="v" style="color:var(--critical)">${sev.critical||0}</div></div>
      <div class="big-stat"><div class="l">Low</div><div class="v" style="color:var(--low)">${sev.low||0}</div></div>
    `;
    m.append(stats);

    // Primary incident card
    if (sum.primary_incident) {
      const p = sum.primary_incident;
      const card = el('div','pcard');
      card.style.borderLeft = `2px solid var(--${sevColor(p.severity)})`;
      card.innerHTML = `
        <div class="a-top">
          <span class="a-tag">PRIMARY INCIDENT</span>
          <span class="a-path">${escapeHTML(wlPath(p.workload))}</span>
          <span class="a-sev">${(p.severity||'').toUpperCase()}</span>
        </div>
        <div class="h-tier1">${escapeHTML(p.human_headline||'Anomaly')}</div>
        ${p.technical_headline ? `<div class="h-tier2">${escapeHTML(p.technical_headline)}</div>`:''}
        ${p.short_story ? `<div class="a-story">${escapeHTML(p.short_story)}</div>`:''}
        ${p.confidence ? `<div class="a-confidence"><span>Confidence</span><div class="bar"><div style="width:${p.confidence}%"></div></div><strong>${p.confidence}%</strong></div>`:''}
      `;
      const acts = el('div','a-actions');
      const view = el('button','btn primary','Investigate');
      view.onclick = () => showIssueModal(p.id);
      acts.append(view);
      card.append(acts);
      m.append(card);
    } else {
      const calm = el('div','pcard');
      calm.innerHTML = `<h2>All clear</h2><div class="sub">No active incidents in the last 6 hours.</div>`;
      m.append(calm);
    }

    // Recent deployments
    if ((sum.recent_deployments||[]).length) {
      const card = el('div','pcard');
      card.append(el('h2','','Recent deployments'));
      card.append(el('div','sub','Last 24 hours · "did this deploy break something?"'));
      sum.recent_deployments.forEach(d => {
        const r = el('div','row-line');
        const tag = d.issue_detected
          ? `<span style="color:var(--high)">Caused ${d.caused_anomalies}</span>`
          : `<span style="color:var(--low)">Healthy</span>`;
        r.innerHTML = `<div><strong>${escapeHTML(d.workload.name)}</strong> <span class="meta">· ${escapeHTML(d.workload.namespace)} · ${fmtTime(d.when)}</span></div><div>${tag}</div>`;
        card.append(r);
      });
      m.append(card);
    }
  }

  async function renderIssues() {
    const sum = lastSummary || await api.summary();
    const data = await api.issues({});
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Issues'));

    const tabs = el('div','tabs');
    const all = el('div','tab' + (activeSeverity===''?' active':''),
      `All <span class="num">${(data.issues||[]).length}</span>`);
    all.onclick = () => { activeSeverity=''; lastSig=null; rerender(); };
    tabs.append(all);
    [['critical','crit'],['high','high'],['medium','med'],['low','low']].forEach(([k,c]) => {
      const t = el('div',`tab` + (activeSeverity===k?' active':''),
        `<span class="sevdot ${k}"></span>${k[0].toUpperCase()+k.slice(1)} <span class="num">${(sum.by_severity||{})[k]||0}</span>`);
      t.onclick = () => { activeSeverity = (activeSeverity===k?'':k); lastSig=null; rerender(); };
      tabs.append(t);
    });
    m.append(tabs);

    let issues = (data.issues||[]).slice();
    if (activeSeverity) issues = issues.filter(i => i.severity === activeSeverity);
    if (issues.length === 0) {
      m.append(el('div','empty','No issues match this filter.'));
    } else {
      issues.forEach(i => m.append(issueCard(i)));
    }
  }

  function issueCard(iss) {
    const card = el('div',`a-card sev-${sevColor(iss.severity)}`);
    const typeLabel = ({log_anomaly:'LOG ANOMALY', config_issue:'CONFIG ISSUE', crash_loop:'CRASH LOOP', scheduling:'SCHEDULING'})[iss.type] || iss.type.toUpperCase();
    card.innerHTML = `
      <div class="a-top">
        <span class="a-tag">${typeLabel}</span>
        <span class="a-path">${escapeHTML(wlPath(iss.workload))}</span>
        <span class="a-sev">${(iss.severity||'').toUpperCase()}</span>
      </div>
      <div class="h-tier1">${escapeHTML(iss.human_headline||'Issue')}</div>
      ${iss.technical_headline ? `<div class="h-tier2">${escapeHTML(iss.technical_headline)}</div>`:''}
      ${iss.short_story ? `<div class="a-story">${escapeHTML(iss.short_story)}</div>`:''}
      ${iss.confidence ? `<div class="a-confidence"><span>Confidence</span><div class="bar"><div style="width:${iss.confidence}%"></div></div><strong>${iss.confidence}%</strong></div>`:''}
    `;
    const acts = el('div','a-actions');
    const view = el('button','btn primary','Investigate'); view.onclick = () => showIssueModal(iss.id); acts.append(view);
    const sil = el('button','btn','Silence'); sil.onclick = () => doIssueAction(iss.id, 'silence'); acts.append(sil);
    const res = el('button','btn ghost','Resolve'); res.onclick = () => doIssueAction(iss.id, 'resolve'); acts.append(res);
    card.append(acts);
    return card;
  }

  async function doIssueAction(id, action) {
    try { await api.issueState(id, action); toast(action[0].toUpperCase()+action.slice(1)+'d'); lastSig=null; tick(); }
    catch(e) { toast('Failed: '+e.message); }
  }

  async function showIssueModal(id) {
    try {
      const i = await api.issue(id);
      const shade = el('div','modal-shade');
      const m = el('div','modal');
      m.innerHTML = `
        <h3>${escapeHTML(i.human_headline||'Issue')}</h3>
        ${i.technical_headline ? `<div class="sub">${escapeHTML(i.technical_headline)}</div>`:''}
        ${i.likely_cause ? `<div class="pcard" style="margin:12px 0"><h2>Likely cause</h2><div>${escapeHTML(i.likely_cause)}</div></div>`:''}
        ${i.what_happened ? `<div class="pcard" style="margin:12px 0"><h2>What happened</h2><div style="color:var(--muted)">${escapeHTML(i.what_happened)}</div></div>`:''}
      `;
      // timeline
      if (i.timeline && i.timeline.length) {
        const t = el('div','pcard');
        t.append(el('h2','','Timeline'));
        i.timeline.forEach(s => {
          const r = el('div','tl-row');
          r.innerHTML = `<div style="color:var(--muted-2)">${fmtTime(s.when)}</div><div style="color:var(--muted-2);text-transform:uppercase;font-size:11px">${escapeHTML(s.kind||'')}</div><div><strong>${escapeHTML(s.label)}</strong>${s.detail?` <span class="meta">— ${escapeHTML(s.detail)}</span>`:''}</div>`;
          t.append(r);
        });
        m.append(t);
      }
      // suggested fix
      if (i.suggested_fix && i.suggested_fix.length) {
        const sec = el('div','pcard');
        sec.append(el('h2','','Suggested fix'));
        i.suggested_fix.forEach((s, idx) => {
          const row = el('div','step-line');
          row.append(el('div','step-num', String(idx+1)));
          const body = el('div'); body.innerHTML = `<div><strong>${escapeHTML(s.title)}</strong></div>${s.command?'<div class="cmd">'+escapeHTML(s.command)+'</div>':''}${s.why?'<div class="meta">'+escapeHTML(s.why)+'</div>':''}`;
          row.append(body);
          sec.append(row);
        });
        m.append(sec);
      }
      const acts = el('div','actions'); const close = el('button','btn ghost','Close'); close.onclick = () => shade.remove(); acts.append(close); m.append(acts);
      shade.append(m); shade.onclick = e => { if (e.target===shade) shade.remove(); };
      document.body.append(shade);
    } catch(e) { toast('Failed: '+e.message); }
  }

  async function renderChanges() {
    const data = await api.timeline({since:'6h'});
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('What changed'));
    const card = el('div','pcard');
    card.append(el('h2','','Last 6 hours'));
    card.append(el('div','sub','Deploys · ConfigMap edits · observed issues — chronological.'));
    const items = (data.items || []).slice().reverse();
    if (!items.length) {
      card.append(el('div','empty','Nothing changed in the last 6 hours.'));
    } else {
      items.forEach(it => {
        const r = el('div','tl-row');
        r.innerHTML = `<div style="color:var(--muted-2)">${fmtTime(it.when)}</div><div style="color:var(--muted-2);text-transform:uppercase;font-size:11px">${escapeHTML(it.kind||'')}</div><div><strong>${escapeHTML(it.label)}</strong>${it.detail?` <span class="meta">— ${escapeHTML(it.detail)}</span>`:''}</div>`;
        card.append(r);
      });
    }
    m.append(card);
  }

  async function renderWorkloads() {
    const data = await api.workloads();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Workloads'));
    const card = el('div','pcard');
    card.append(el('h2','',`${data.count||0} workloads observed`));
    const t = document.createElement('table');
    t.innerHTML = `<thead><tr><th>Namespace</th><th>Kind</th><th>Name</th><th>Pods</th><th>Anomalies</th><th>Worst</th></tr></thead><tbody></tbody>`;
    const tb = t.querySelector('tbody');
    (data.workloads||[]).slice(0,200).forEach(w => {
      const tr = document.createElement('tr');
      const sev = w.worst_severity || '';
      tr.innerHTML = `<td>${escapeHTML(w.workload.namespace)}</td><td style="color:var(--muted-2)">${escapeHTML(w.workload.kind||'')}</td><td><strong>${escapeHTML(w.workload.name)}</strong></td><td>${w.pods}</td><td>${w.anomaly_count}</td><td>${sev?`<span class="sevdot ${sev}"></span>${sev}`:'—'}</td>`;
      tb.append(tr);
    });
    card.append(t);
    m.append(card);
  }

  async function renderDeployments() {
    const data = await api.deployments();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Deployments'));
    const card = el('div','pcard');
    card.append(el('h2','',`${data.count||0} rollouts in the last 7 days`));
    if (!data.deployments || !data.deployments.length) {
      card.append(el('div','empty','No rollouts recently.'));
    } else {
      data.deployments.forEach(d => {
        const r = el('div','row-line');
        const tag = d.issue_detected
          ? `<span style="color:var(--high)">Caused ${d.caused_anomalies}</span>`
          : `<span style="color:var(--low)">Healthy</span>`;
        r.innerHTML = `<div><strong>${escapeHTML(d.workload.name)}</strong> <span class="meta">· ${escapeHTML(d.workload.namespace)} · ${fmtTime(d.when)}${d.commit?` · ${escapeHTML(d.commit.slice(0,7))}`:''}</span></div><div>${tag}</div>`;
        card.append(r);
      });
    }
    m.append(card);
  }

  async function renderServices() {
    const data = await api.services();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Services'));
    const card = el('div','pcard');
    card.append(el('h2','',`${data.count||0} services observed`));
    const t = document.createElement('table');
    t.innerHTML = `<thead><tr><th>Namespace</th><th>Name</th><th>Type</th><th>ClusterIP</th><th>Ports</th></tr></thead><tbody></tbody>`;
    const tb = t.querySelector('tbody');
    (data.services||[]).slice(0,200).forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${escapeHTML(s.Namespace)}</td><td><strong>${escapeHTML(s.Name)}</strong></td><td>${escapeHTML(s.Type||'')}</td><td style="font-family:ui-monospace,monospace;font-size:11.5px">${escapeHTML(s.ClusterIP||'')}</td><td style="font-family:ui-monospace,monospace;font-size:11.5px">${escapeHTML((s.Ports||[]).join(', '))}</td>`;
      tb.append(tr);
    });
    card.append(t);
    m.append(card);
  }

  // -------------- ADMIN APP PAGES --------------

  async function renderClusters() {
    const data = await api.listClusters();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Clusters'));

    // Form
    const form = el('div','pcard');
    form.append(el('h2','','Register a cluster'));
    form.append(el('div','sub','Upload a kubeconfig. PodPulse uses it to manage onboarded users in that cluster and to proxy kubectl traffic.'));
    const grid = el('div','form-grid full');
    grid.innerHTML = `
      <div class="field"><label>Cluster name</label><input id="c-name" placeholder="dev-cluster-uae"></div>
      <div class="field"><label>Description (optional)</label><input id="c-desc" placeholder="dev AKS in uaenorth"></div>
      <div class="field"><label>kubeconfig (paste YAML)</label><textarea id="c-kube" placeholder="apiVersion: v1\nkind: Config\nclusters:\n- name: my-cluster\n  cluster:\n    server: https://...\n..."></textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn primary" id="c-go">Register cluster</button></div>
    `;
    form.append(grid);
    grid.querySelector('#c-go').onclick = async () => {
      const body = {
        name:        grid.querySelector('#c-name').value.trim(),
        description: grid.querySelector('#c-desc').value.trim(),
        kubeconfig:  grid.querySelector('#c-kube').value,
      };
      if (!body.name || !body.kubeconfig) { toast('Name and kubeconfig are required'); return; }
      try { await api.registerCluster(body); toast('Cluster registered'); lastSig=null; rerender(); }
      catch(e) { toast('Failed: '+e.message); }
    };
    m.append(form);

    // List
    const list = el('div','pcard');
    list.append(el('h2','','Registered clusters'));
    if (!data.clusters || !data.clusters.length) {
      list.append(el('div','empty','No clusters registered yet. Use the form above.'));
    } else {
      data.clusters.forEach(c => {
        const row = el('div','cluster-card');
        row.innerHTML = `
          <div><div class="name">${escapeHTML(c.name)}</div><div class="meta">${escapeHTML(c.description||'no description')}</div></div>
          <div class="meta" style="font-family:ui-monospace,monospace">${escapeHTML((c.apiserver_url||'').slice(0,40))}${(c.apiserver_url||'').length>40?'…':''}</div>
          <div class="meta">added ${fmtAgo(c.created_at)}</div>
          <div><button class="btn danger" data-id="${c.id}">Remove</button></div>
        `;
        row.querySelector('button').onclick = async () => {
          if (!confirm('Remove cluster ' + c.name + '?')) return;
          await api.deleteCluster(c.id); toast('Removed'); lastSig=null; rerender();
        };
        list.append(row);
      });
    }
    m.append(list);
  }

  async function renderUsers() {
    const data = await api.listUsers();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Users'));

    const form = el('div','pcard');
    form.append(el('h2','','Onboard a teammate'));
    form.append(el('div','sub','Creates a ServiceAccount + Role + RoleBinding scoped to one namespace. Issues a 1-hour kubeconfig.'));
    const grid = el('div','form-grid');
    grid.innerHTML = `
      <div class="field"><label>Name</label><input id="u-name" placeholder="alice"></div>
      <div class="field"><label>Namespace</label><input id="u-ns" placeholder="dev"></div>
      <div class="field"><label>Scope</label><select id="u-scope"><option value="viewer">viewer (read-only)</option><option value="developer" selected>developer</option><option value="admin">admin</option></select></div>
      <div class="field"><label>Description</label><input id="u-desc" placeholder="optional"></div>
      <div><button class="btn primary" id="u-go">Onboard</button></div>
    `;
    form.append(grid);
    grid.querySelector('#u-go').onclick = async () => {
      const body = {
        name: grid.querySelector('#u-name').value.trim(),
        namespace: grid.querySelector('#u-ns').value.trim(),
        scope: grid.querySelector('#u-scope').value,
        description: grid.querySelector('#u-desc').value.trim(),
      };
      if (!body.name || !body.namespace) { toast('Name and namespace required'); return; }
      try {
        const u = await api.createUser(body);
        toast('Onboarded ' + u.name);
        showKubeconfigModal(u);
        lastSig=null; rerender();
      } catch(e) { toast('Failed: '+e.message); }
    };
    m.append(form);

    const list = el('div','pcard');
    list.append(el('h2','','Onboarded users'));
    if (!data.users || !data.users.length) {
      list.append(el('div','empty','No users onboarded yet.'));
    } else {
      data.users.forEach(u => {
        const r = el('div','row-line');
        const sevCls = u.scope==='admin'?'crit':u.scope==='developer'?'med':'low';
        r.innerHTML = `<div><strong>${escapeHTML(u.name)}</strong> <span class="meta">· ${escapeHTML(u.namespace)} · </span><span class="imp-label ${sevCls}">${escapeHTML((u.scope||'').toUpperCase())}</span><div class="meta">SA: ${escapeHTML(u.service_account||'')}</div></div><div style="display:flex;gap:6px"><button class="btn primary" data-act="kube">kubeconfig</button><button class="btn danger" data-act="del">remove</button></div>`;
        r.querySelector('[data-act=kube]').onclick = () => showKubeconfigModal(u);
        r.querySelector('[data-act=del]').onclick = async () => {
          if (!confirm('Remove ' + u.name + '?')) return;
          await api.deleteUser(u.name); toast('Removed'); lastSig=null; rerender();
        };
        list.append(r);
      });
    }
    m.append(list);
  }

  function showKubeconfigModal(u) {
    const url = api.userKubeURL(u.name) + '?ttl=3600';
    const shade = el('div','modal-shade');
    const m = el('div','modal');
    m.innerHTML = `
      <h3>kubeconfig for ${escapeHTML(u.name)}</h3>
      <div class="sub">A scoped 1-hour kubeconfig pointing through PodPulse's /k8s proxy. Audit log records every kubectl call.</div>
      <div class="pcard" style="margin-top:14px">
        <div class="row-line"><strong>Namespace</strong><span>${escapeHTML(u.namespace)}</span></div>
        <div class="row-line"><strong>Scope</strong><span>${escapeHTML(u.scope||'')}</span></div>
        <div class="row-line"><strong>ServiceAccount</strong><span>${escapeHTML(u.service_account||'')}</span></div>
      </div>
      <div style="margin-top:14px">
        <strong style="font-size:11px;color:var(--muted-2);text-transform:uppercase">Quick use</strong>
        <div class="cmd">curl -o ${escapeHTML(u.name)}.kubeconfig ${location.origin}${url}\nexport KUBECONFIG=$(pwd)/${escapeHTML(u.name)}.kubeconfig\nkubectl get pods -n ${escapeHTML(u.namespace)}</div>
      </div>
      <div class="actions">
        <a class="btn primary" href="${url}" download="${escapeHTML(u.name)}.kubeconfig">Download kubeconfig</a>
        <button class="btn ghost" id="kc-close">Close</button>
      </div>
    `;
    shade.append(m); shade.onclick = e => { if (e.target===shade) shade.remove(); };
    document.body.append(shade);
    m.querySelector('#kc-close').onclick = () => shade.remove();
  }

  let auditFilter = { only_humans: 'true', since: '6h' };
  async function renderAudit() {
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Audit log'));

    const filt = el('div','pcard');
    filt.style.display = 'flex';
    filt.style.gap = '10px';
    filt.style.alignItems = 'center';
    const onlyH = el('label','',`<input type="checkbox" ${auditFilter.only_humans==='true'?'checked':''}/> Only human actors`);
    onlyH.style.cssText='font-size:12px;color:var(--muted)';
    onlyH.querySelector('input').onchange = e => { auditFilter.only_humans = e.target.checked?'true':''; lastSig=null; rerender(); };
    filt.append(onlyH);
    ['1h','6h','24h'].forEach(d => {
      const b = el('button','btn'+(auditFilter.since===d?' primary':''),'Last '+d);
      b.onclick = () => { auditFilter.since=d; lastSig=null; rerender(); };
      filt.append(b);
    });
    m.append(filt);

    const data = await api.audit(auditFilter);
    const list = el('div','pcard');
    list.append(el('h2','',`Mutations${auditFilter.actor?' by '+auditFilter.actor:''} (${data.count||0})`));
    if (!data.events || !data.events.length) {
      list.append(el('div','empty','No mutations in this window. Either nothing changed, or PodPulse needs a few seconds.'));
    } else {
      const head = el('div','audit-row');
      head.style.cssText = 'color:var(--muted-2);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em';
      head.innerHTML = `<div>Time</div><div>Actor</div><div>Action</div><div>Object</div><div>Risk</div>`;
      list.append(head);
      data.events.forEach(e => {
        const r = el('div','audit-row');
        const fields = (e.fields||[]).join(', ');
        const riskCls = ({high:'high',medium:'med',info:'low'})[e.risk] || 'low';
        r.innerHTML = `<div style="color:var(--muted-2);font-variant-numeric:tabular-nums">${fmtTime(e.when)}</div><div><strong>${escapeHTML(e.actor)}</strong></div><div style="color:var(--muted-2);text-transform:uppercase;font-size:11px">${escapeHTML(e.action||'')}</div><div><strong>${escapeHTML(e.kind)}/${escapeHTML(e.name)}</strong> <span class="meta">${e.namespace?'in '+escapeHTML(e.namespace):''}</span>${fields?`<div class="meta">touched: ${escapeHTML(fields)}</div>`:''}</div><div><span class="imp-label ${riskCls}">${(e.risk||'').toUpperCase()}</span></div>`;
        list.append(r);
      });
    }
    m.append(list);
  }

  async function renderChannels() {
    const data = await api.channels();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Channels'));
    const card = el('div','pcard');
    card.append(el('h2','','Alert channels'));
    const all = ['slack','teams','smtp','pagerduty','webhook'];
    const cfg = new Set((data.channels||[]).map(c => c.name));
    all.forEach(name => {
      const r = el('div','row-line');
      r.innerHTML = `<div><strong>${escapeHTML(name[0].toUpperCase()+name.slice(1))}</strong></div><div>${cfg.has(name)?'<span style="color:var(--low)">Configured</span>':'<span class="meta">Not configured</span>'}</div>`;
      card.append(r);
    });
    m.append(card);
  }

  async function renderSettings() {
    const sum = lastSummary || await api.summary();
    const m = $('#main'); m.innerHTML = '';
    m.append(pageHead('Settings'));
    const card = el('div','pcard');
    card.append(el('h2','','Detector status'));
    card.innerHTML += `
      <div class="row-line"><strong>K8s integration</strong><span>${sum.k8s_connected?'<span style="color:var(--low)">Connected</span>':'<span style="color:var(--high)">Not connected</span>'}</span></div>
      <div class="row-line"><strong>Storage</strong><span>${escapeHTML(sum.storage_policy||'')}</span></div>
      <div class="row-line"><strong>Started</strong><span class="meta">${sum.started_at?new Date(sum.started_at).toLocaleString():'—'}</span></div>
      <div class="row-line"><strong>Channels</strong><span class="meta">${(sum.channels||[]).join(', ') || 'none'}</span></div>
    `;
    m.append(card);
  }

  // -------------- shared header builder --------------
  function pageHead(title, actions) {
    const h = el('div','page-head');
    const t = el('h1','', escapeHTML(title));
    h.append(t);
    if (actions && actions.length) {
      const a = el('div','actions');
      actions.forEach(([label, href, primary]) => {
        const link = el('a',`btn${primary?' primary':''}`, escapeHTML(label));
        link.href = href; link.target = '_blank';
        a.append(link);
      });
      h.append(a);
    }
    return h;
  }
</script>
