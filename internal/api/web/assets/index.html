<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PodPulse</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1a1f2b;
    --panel-3: #232938;
    --border: #232938;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #4cc2ff;
    --accent-2: #6c5ce7;
    --low:      #69d199;
    --medium:   #f7c548;
    --high:     #ff8a3d;
    --critical: #ff4d6d;
    --ok:       #69d199;
    --warn:     #ff8a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* App grid */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr 320px;
    grid-template-rows: 60px 1fr;
    grid-template-areas:
      "side topbar topbar"
      "side main rail";
    height: 100vh;
  }

  /* Sidebar */
  .side {
    grid-area: side;
    background: linear-gradient(180deg, #0e1119 0%, #0b0d12 100%);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 18px 12px;
    gap: 4px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 18px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .brand .pulse-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
    position: relative;
  }
  .brand .pulse-dot::after {
    content: ''; position: absolute; inset: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(76, 194, 255, .55);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76, 194, 255, .55); }
    70% { box-shadow: 0 0 0 10px rgba(76, 194, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(76, 194, 255, 0); }
  }
  .brand .name { font-weight: 600; font-size: 16px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: var(--panel); color: var(--text); }
  .nav-item.active { background: var(--panel); color: var(--accent); }
  .nav-item .ic { width: 18px; height: 18px; opacity: .9; }
  .nav-item .badge {
    margin-left: auto;
    background: var(--panel-3);
    color: var(--text);
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
    min-width: 20px; text-align: center;
  }
  .side-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }
  .storage-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .storage-card .row1 { display: flex; align-items: center; gap: 8px; color: var(--ok); font-size: 12px; }
  .storage-card .row2 { color: var(--text); font-size: 12px; margin-top: 4px; }
  .storage-card .row3 { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px;
  }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-2); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
  .user-card .name { font-size: 13px; color: var(--text); }
  .user-card .role { font-size: 11px; color: var(--muted); }

  /* Topbar */
  .topbar {
    grid-area: topbar;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 22px;
    gap: 16px;
    background: rgba(11,13,18,.85);
    backdrop-filter: blur(8px);
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .topbar .meta { margin-left: auto; display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 13px; }
  .bell { position: relative; padding: 6px; cursor: pointer; }
  .bell .count {
    position: absolute; top: -2px; right: -2px;
    background: var(--critical); color: white;
    border-radius: 10px;
    font-size: 10px;
    padding: 1px 5px;
    min-width: 18px; text-align: center;
  }

  /* Main */
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 22px 28px 60px;
  }

  /* Right rail */
  .rail {
    grid-area: rail;
    background: var(--bg);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px 18px 60px;
  }
  .rail .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .rail .card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--text); }
  .rail .card .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }

  /* Severity tabs */
  .tabs { display: flex; align-items: center; gap: 22px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 18px; }
  .tab { color: var(--muted); cursor: pointer; padding-bottom: 4px; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 7px; }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tab .num { background: var(--panel-2); border-radius: 10px; padding: 1px 8px; font-size: 12px; color: var(--text); }
  .tab.crit .dot { background: var(--critical); }
  .tab.high .dot { background: var(--high); }
  .tab.med  .dot { background: var(--medium); }
  .tab.low  .dot { background: var(--low); }

  /* Right cluster — filters + time range */
  .filters-row {
    display: flex; align-items: center; gap: 12px; justify-content: flex-end;
    margin-top: -54px; margin-bottom: 18px;
  }
  .pill {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; color: var(--text); font-size: 13px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pill.primary { background: var(--accent-2); border-color: var(--accent-2); }
  .pill svg { width: 14px; height: 14px; opacity: .8; }

  /* Anomaly card */
  .a-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--medium);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    animation: slideIn .35s ease;
  }
  .a-card.sev-low      { border-left-color: var(--low); }
  .a-card.sev-medium   { border-left-color: var(--medium); }
  .a-card.sev-high     { border-left-color: var(--high); }
  .a-card.sev-critical { border-left-color: var(--critical); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .a-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .a-tag {
    background: rgba(247,197,72,.14); color: var(--medium);
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
  }
  .a-tag.crit  { background: rgba(255,77,109,.14); color: var(--critical); }
  .a-tag.high  { background: rgba(255,138,61,.14); color: var(--high); }
  .a-tag.low   { background: rgba(105,209,153,.14); color: var(--low); }
  .a-tag.deploy { background: rgba(76,194,255,.14); color: var(--accent); }

  .a-path { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .a-path .copy { margin-left: 6px; opacity: .5; cursor: pointer; }
  .a-sev {
    margin-left: auto;
    background: var(--panel-2);
    color: var(--medium);
    text-transform: uppercase; font-size: 10.5px; letter-spacing: .8px;
    padding: 3px 10px; border-radius: 12px; font-weight: 600;
  }
  .sev-medium .a-sev { color: var(--medium); }
  .sev-high     .a-sev { color: var(--high); }
  .sev-critical .a-sev { color: var(--critical); }
  .sev-low      .a-sev { color: var(--low); }

  .a-headline { font-size: 16px; font-weight: 600; margin: 6px 0 4px; }
  .a-headline .first-seen {
    margin-left: 8px;
    background: rgba(108,92,231,.18);
    color: #b9aef7;
    font-size: 11px;
    padding: 2px 8px; border-radius: 10px;
    font-weight: 500;
  }
  .a-story { color: var(--text); margin-bottom: 6px; }
  .a-story .impact { color: var(--muted); }
  .a-story .impact.high { color: var(--high); }
  .a-story .impact.critical { color: var(--critical); }

  .a-meta { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; margin-top: 8px; }
  .a-impact { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12.5px; }
  .a-impact .row { display: flex; align-items: center; gap: 6px; }
  .a-times { color: var(--muted); font-size: 12px; text-align: right; }
  .a-times .ago { color: var(--text); }

  .a-timeline {
    display: flex; gap: 10px; flex-wrap: wrap;
    background: var(--panel-2); border-radius: 6px;
    padding: 8px 10px; margin-top: 12px; font-size: 12px; color: var(--muted);
  }
  .a-timeline .step { display: inline-flex; align-items: center; gap: 6px; }
  .a-timeline .step strong { color: var(--text); font-weight: 500; }
  .a-timeline .arrow { color: var(--border); }

  .a-confidence { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .a-confidence .bar { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .a-confidence .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  .a-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .a-chip { background: var(--panel-2); border-radius: 5px; padding: 3px 8px; display: inline-flex; align-items: center; gap: 5px; }
  .a-chip code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); font-size: 11.5px; }
  .a-chip.variants { background: rgba(108,92,231,.12); color: #b9aef7; }

  .a-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 6px; font-size: 12.5px; }
  .btn:hover { background: var(--panel-3); }
  .btn.primary { background: var(--accent-2); border-color: var(--accent-2); color: white; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; }

  .a-suggestions { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .a-suggestions h4 { font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
  .a-sug { background: var(--panel-2); border-radius: 6px; padding: 9px 10px; margin-bottom: 6px; }
  .a-sug .t { font-size: 13px; font-weight: 500; }
  .a-sug code { display: block; margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ok); white-space: pre-wrap; word-break: break-all; }
  .a-sug .why { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* Generic cards / lists / table */
  .pcard {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .pcard h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-size: 13px; }
  .row .meta { color: var(--muted); font-size: 12px; }
  .row .num { background: var(--panel-2); border-radius: 5px; padding: 2px 8px; font-size: 12px; }

  /* Sparkline + severity totals (rail) */
  .sev-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .sev-cell { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; text-align: left; }
  .sev-cell .n { font-size: 18px; font-weight: 600; }
  .sev-cell .l { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .sev-cell.crit .n { color: var(--critical); }
  .sev-cell.high .n { color: var(--high); }
  .sev-cell.med  .n { color: var(--medium); }
  .sev-cell.low  .n { color: var(--low); }
  .sev-cell.crit .l, .sev-cell.high .l, .sev-cell.med .l, .sev-cell.low .l { color: inherit; opacity: .7; }

  .total-line { display: flex; align-items: end; gap: 12px; }
  .total-line .big { font-size: 36px; font-weight: 700; line-height: 1; }
  .total-line .lbl { color: var(--muted); font-size: 12px; padding-bottom: 2px; }

  /* Empty / loading */
  .empty { padding: 60px 0; text-align: center; color: var(--muted); }
  .empty .pulse-dot { display: block; width: 32px; height: 32px; margin: 0 auto 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(76,194,255,.55); animation: pulse 1.6s ease-out infinite; }

  /* --- Overview page --- */
  .ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hero {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(255,77,109,.12), rgba(108,92,231,.10));
    border: 1px solid var(--border);
    border-left: 5px solid var(--high);
    border-radius: 14px;
    padding: 22px 24px;
  }
  .hero.crit { border-left-color: var(--critical); }
  .hero.med  { border-left-color: var(--medium); }
  .hero.low  { border-left-color: var(--low); }
  .hero.calm { border-left-color: var(--ok); background: linear-gradient(135deg, rgba(105,209,153,.06), rgba(76,194,255,.04)); }
  .hero h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .hero .lede { color: var(--muted); margin-bottom: 14px; }
  .hero .row1 { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .hero .meta-line { color: var(--muted); font-size: 13px; }
  .hero .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .stat-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    margin: 12px 0 6px;
  }
  .stat-cell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-cell .n { font-size: 28px; font-weight: 700; }
  .stat-cell .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat-cell.crit .n { color: var(--critical); }
  .stat-cell.high .n { color: var(--high); }
  .stat-cell.warn .n { color: var(--medium); }
  .stat-cell.ok   .n { color: var(--ok); }

  .deploy-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .deploy-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
  }
  .deploy-row:last-child { border-bottom: 0; }
  .deploy-row .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex: 0 0 auto;
  }
  .deploy-row .dot.bad { background: var(--high); box-shadow: 0 0 8px rgba(255,138,61,.6); }
  .deploy-row .dot.ok  { background: var(--ok); }
  .deploy-row .body { flex: 1; min-width: 0; }
  .deploy-row .name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deploy-row .sub { font-size: 11.5px; color: var(--muted); }
  .deploy-row .badge { font-size: 11px; padding: 3px 9px; border-radius: 12px; flex: 0 0 auto; }
  .deploy-row .badge.bad { background: rgba(255,138,61,.14); color: var(--high); }
  .deploy-row .badge.ok  { background: rgba(105,209,153,.12); color: var(--ok); }

  .rec-card {
    background: linear-gradient(135deg, rgba(76,194,255,.08), rgba(108,92,231,.06));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .rec-card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .rec-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .rec-reason { color: var(--muted); margin-bottom: 10px; font-size: 13px; }

  /* Blast-radius dots */
  .blast { display: inline-flex; gap: 4px; align-items: center; }
  .blast .b { width: 8px; height: 8px; border-radius: 50%; background: var(--panel-3); }
  .blast .b.on { background: var(--high); }
  .blast.crit .b.on { background: var(--critical); }
  .blast.med  .b.on { background: var(--medium); }
  .blast.low  .b.on { background: var(--low); }

  /* Collapsed-low banner */
  .low-fold {
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 14px;
    text-align: center;
  }
  .low-fold:hover { background: var(--panel-3); }

  /* Three-tier headline */
  .h-tier1 { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
  .h-tier2 { color: var(--muted); margin-top: 2px; font-size: 14px; }
  .h-tier3 { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); margin-top: 6px; word-break: break-all; opacity: .7; }

  /* Urgency pill */
  .urg { font-size: 10.5px; padding: 3px 9px; border-radius: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
  .urg.new       { background: rgba(76,194,255,.14); color: var(--accent); }
  .urg.active    { background: rgba(255,138,61,.14); color: var(--high); }
  .urg.worsening { background: rgba(255,77,109,.14); color: var(--critical); }
  .urg.settled   { background: rgba(105,209,153,.12); color: var(--ok); }

  /* Impact label */
  .imp-label { font-size: 12.5px; font-weight: 600; }
  .imp-label.low  { color: var(--low); }
  .imp-label.med  { color: var(--medium); }
  .imp-label.high { color: var(--high); }
  .imp-label.crit { color: var(--critical); }

  /* Confidence factors list */
  .conf-explain { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .conf-explain ul { margin: 4px 0 0 0; padding-left: 16px; }
  .conf-explain li { margin: 2px 0; }
  .conf-help {
    margin-left: 8px; cursor: help;
    color: var(--muted); border: 1px solid var(--border);
    border-radius: 50%; width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px;
  }

  /* Before/after panel */
  .ba-panel {
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 14px; margin-top: 14px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .ba-cell .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .ba-cell .n { font-size: 22px; font-weight: 700; }
  .ba-cell .n.bad { color: var(--high); }
  .ba-cell .n.ok { color: var(--ok); }
  .ba-cell .s { font-size: 11.5px; color: var(--muted); }
  .ba-change { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
  .ba-change .v { font-size: 18px; font-weight: 700; color: var(--critical); }
  .ba-change .v.inf { font-size: 22px; }
  .ba-change .l { font-size: 10.5px; color: var(--muted); }

  /* What-happened narrative */
  .narrative {
    background: var(--panel-2);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 14px;
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.55;
  }
  .narrative h4 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 500; }
  .cause { color: var(--medium); margin-top: 6px; font-size: 13px; }

  /* Numbered next-steps */
  .steps { margin-top: 12px; }
  .steps h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
  .step {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px;
    margin-bottom: 8px; align-items: start;
  }
  .step-num {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--panel-2);
    color: var(--accent);
    font-size: 12px; font-weight: 600;
    display: grid; place-items: center;
    border: 1px solid var(--border);
  }
  .step-body { font-size: 13.5px; }
  .step-body .t { font-weight: 500; }
  .step-body code {
    display: block;
    background: #0a0c11;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    margin-top: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--ok);
    word-break: break-all;
  }
  .step-body .why { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* Modal (rollback command) */
  .modal-shade { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 60; display: grid; place-items: center; padding: 30px; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    max-width: 640px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h3 { margin: 0 0 8px; }
  .modal .cmd { background: #0a0c11; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--ok); margin: 12px 0; word-break: break-all; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 500; }

  /* Severity dot helper */
  .sevdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
  .sevdot.critical { background: var(--critical); }
  .sevdot.high { background: var(--high); }
  .sevdot.medium { background: var(--medium); }
  .sevdot.low { background: var(--low); }

  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.4); animation: slideIn .25s; }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="pulse-dot"></div>
      <div class="name">PodPulse</div>
    </div>
    <a class="nav-item" data-route="overview">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      Overview
    </a>
    <a class="nav-item active" data-route="anomalies">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 22h20L12 2zM12 9v5M12 18h.01"/></svg>
      Anomalies <span class="badge" id="nav-anomalies-count">0</span>
    </a>
    <a class="nav-item" data-route="workloads">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
      Workloads
    </a>
    <a class="nav-item" data-route="incidents">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16a2 2 0 01-2 2H6l-4 4V4a2 2 0 012-2h16a2 2 0 012 2v12z"/></svg>
      Incidents
    </a>
    <a class="nav-item" data-route="deployments">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18l7-5 7 5V3z"/></svg>
      Deployments
    </a>
    <a class="nav-item" data-route="services">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>
      Services
    </a>
    <a class="nav-item" data-route="events">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Events
    </a>
    <a class="nav-item" data-route="silences">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      Silences
    </a>
    <a class="nav-item" data-route="channels">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Channels
    </a>
    <a class="nav-item" data-route="settings">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2.1-1.6-2-3.4-2.5.9a7 7 0 00-1.7-1L14 3h-4l-.8 2.5a7 7 0 00-1.7 1l-2.5-.9-2 3.4L5.1 11a7 7 0 000 2L3 14.6l2 3.4 2.5-.9c.5.4 1.1.7 1.7 1L10 21h4l.8-2.5a7 7 0 001.7-1l2.5.9 2-3.4-2.1-1.6c.1-.3.1-.7.1-1z"/></svg>
      Settings
    </a>

    <div class="side-foot">
      <div class="storage-card" title="Templates and counts only — raw logs are not retained.">
        <div class="row1">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
          Storage Mode
        </div>
        <div class="row2">Template &amp; metrics only</div>
        <div class="row3">(Raw logs disabled)</div>
      </div>
      <div class="user-card">
        <div class="avatar">AD</div>
        <div>
          <div class="name">Admin</div>
          <div class="role">Administrator</div>
        </div>
      </div>
    </div>
  </aside>

  <header class="topbar">
    <h1 id="page-title">Anomalies</h1>
    <div class="meta">
      <div class="bell" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="count" id="bell-count">0</span>
      </div>
      <div id="topbar-count">0 anomalies</div>
      <div id="topbar-time"></div>
    </div>
  </header>

  <main class="main" id="main"></main>

  <aside class="rail" id="rail"></aside>
</div>

<script type="module">
  // -------------- helpers --------------
  const $ = (s, p=document) => p.querySelector(s);
  const $$ = (s, p=document) => Array.from(p.querySelectorAll(s));
  const el = (tag, cls, content) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (content != null) e.innerHTML = content;
    return e;
  };
  const fmtTime = d => new Date(d).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const fmtAgo = d => {
    const ms = Date.now() - new Date(d).getTime();
    if (ms < 60_000) return 'a few seconds ago';
    const m = Math.floor(ms / 60_000);
    if (m < 60) return m + ' min ago';
    const h = Math.floor(m / 60);
    return h + ' hr ago';
  };
  const sevColor = s => ({critical:'critical',high:'high',medium:'medium',low:'low'}[s] || 'medium');
  const sevPretty = s => (s||'medium').toUpperCase();
  const wlPath = w => `${w.namespace || '?'} / ${w.kind || '?'} / ${w.name || '?'}`;
  const escapeHTML = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // -------------- API --------------
  const api = {
    summary:    () => fetch('/v1/summary').then(r => r.json()),
    anomalies:  q => fetch('/v1/anomalies?' + new URLSearchParams(q||{})).then(r => r.json()),
    anomaly:    id => fetch('/v1/anomalies/' + encodeURIComponent(id)).then(r => r.json()),
    setState:   (id, action) => fetch(`/v1/anomalies/${encodeURIComponent(id)}/${action}`, {method:'POST'}).then(r => r.json()),
    workloads:  () => fetch('/v1/workloads').then(r => r.json()),
    services:   () => fetch('/v1/services').then(r => r.json()),
    deployments:() => fetch('/v1/deployments').then(r => r.json()),
    events:     () => fetch('/v1/events').then(r => r.json()),
    incidents:  () => fetch('/v1/incidents').then(r => r.json()),
    channels:   () => fetch('/v1/channels').then(r => r.json()),
  };

  // -------------- routing --------------
  const routes = {
    overview:    renderOverview,
    anomalies:   renderAnomalies,
    workloads:   renderWorkloads,
    incidents:   renderIncidents,
    deployments: renderDeployments,
    services:    renderServices,
    events:      renderEvents,
    silences:    renderSilences,
    channels:    renderChannels,
    settings:    renderSettings,
  };
  const titles = {
    overview: 'Overview', anomalies: 'Anomalies', workloads: 'Workloads',
    incidents: 'Incidents', deployments: 'Deployments', services: 'Services',
    events: 'Events', silences: 'Silences', channels: 'Channels', settings: 'Settings',
  };

  let activeRoute = 'overview';
  let activeSeverity = ''; // empty = all
  let showLow = false;     // collapse low-severity in the anomalies list by default
  $$('.nav-item').forEach(n => n.addEventListener('click', e => {
    e.preventDefault();
    const r = n.dataset.route;
    if (r) navigate(r);
  }));

  function navigate(r) {
    activeRoute = r;
    activeSeverity = '';
    lastRenderSig = null;       // force a fresh render on route change
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === r));
    $('#page-title').textContent = titles[r] || r;
    rerender(true);
  }

  // -------------- polling + render gating --------------
  // We poll the summary every 5s (slow, just to update topbar counts +
  // detect new anomalies) and only re-render the heavy page content
  // when the data signature actually changes. Relative timestamps in
  // existing cards are refreshed in place every 30s.
  let lastSummary = null;
  let lastRenderSig = null;

  function summarySig(sum) {
    if (!sum) return 'null';
    const sev = sum.by_severity || {};
    return [
      sum.total,
      sev.critical, sev.high, sev.medium, sev.low,
      (sum.top_workloads||[]).map(w => w.workload.name + ':' + w.anomaly_count).join('|'),
      (sum.recent_deployments||[]).map(d => d.workload.name + ':' + d.caused_anomalies).join('|'),
    ].join('#');
  }

  async function tick() {
    try {
      const sum = await api.summary();
      lastSummary = sum;
      $('#topbar-count').textContent = `${sum.total} anomalies`;
      $('#topbar-time').textContent = new Date().toLocaleTimeString();
      $('#nav-anomalies-count').textContent = sum.total;
      $('#bell-count').textContent = sum.total;
      $('#bell-count').style.display = sum.total ? 'inline-block' : 'none';
    } catch(e) {
      $('#topbar-time').textContent = 'detector unreachable';
      return;
    }
    // Only redraw if the meaningful state changed.
    const sig = activeRoute + '|' + activeSeverity + '|' + summarySig(lastSummary);
    if (sig !== lastRenderSig) {
      lastRenderSig = sig;
      rerender(false);
    }
  }
  async function rerender(force) {
    try {
      await routes[activeRoute]();
    } catch (e) {
      $('#main').innerHTML = '<div class="empty">Error: ' + escapeHTML(e.message) + '</div>';
    }
  }

  // Refresh "X min ago" timestamps in place without redrawing cards.
  function refreshRelativeTimes() {
    $$('[data-fired]').forEach(node => {
      node.textContent = fmtAgo(node.dataset.fired);
    });
  }

  tick();
  setInterval(tick, 5000);
  setInterval(refreshRelativeTimes, 30000);

  // -------------- Overview (hero incident + deployment impact + smart rec) --------------
  async function renderOverview() {
    const sum = lastSummary || await api.summary();
    const m = $('#main');
    m.innerHTML = '';

    // 1. HERO: top-of-page status. Either "1 active incident" or "Healthy".
    m.append(heroStatus(sum));

    // 2. Stat row: actionable counts.
    m.append(statRow(sum));

    // 3. Two-col grid: Primary incident card + Deployment impact panel.
    const grid = el('div','ov-grid');
    grid.append(primaryIncidentCard(sum), deploymentImpactCard(sum));
    m.append(grid);

    // 4. Smart recommendation card.
    if (sum.recommendations && sum.recommendations.length) {
      m.append(recommendationCard(sum.recommendations[0]));
    }

    // 5. Trends sparkline.
    const trend = el('div','pcard');
    trend.append(el('h3','','📊 Anomaly trend (last 6 hours)'));
    trend.append(sparkline(sum.sparkline));
    m.append(trend);

    renderRail(sum);
  }

  function heroStatus(sum) {
    const high = sum.high_risk_count || 0;
    const active = sum.active_count || 0;
    const primary = sum.primary_incident;

    let cls = 'hero calm';
    let h2 = '✅ All clear';
    let lede = `No active incidents in the last 6 hours.`;
    if (primary) {
      const sev = primary.severity || 'medium';
      cls = 'hero ' + (sev === 'critical' ? 'crit' : sev === 'medium' ? 'med' : sev === 'low' ? 'low' : '');
      const incCount = high > 0 ? high : 1;
      h2 = `🚨 ${incCount} active ${incCount === 1 ? 'incident' : 'incidents'} need attention`;
      lede = `${active} active anomalies · ${high} high-risk · ${sum.low_count || 0} low-impact (collapsed)`;
    } else if (sum.total > 0) {
      cls = 'hero low';
      h2 = `⚠ ${sum.total} anomalies — none critical`;
      lede = `Most are low-impact. Review the list when you have time.`;
    }
    const hero = el('div', cls);
    hero.append(el('h2','', h2), el('div','lede', escapeHTML(lede)));
    return hero;
  }

  function statRow(sum) {
    const row = el('div','stat-row');
    const high = sum.high_risk_count || 0;
    const cells = [
      ['crit', high, `High-risk ${high === 1 ? 'issue' : 'issues'}`],
      ['warn', (sum.recent_deployments||[]).filter(d => d.issue_detected).length, 'Deployments with issues'],
      ['ok', (sum.recent_deployments||[]).filter(d => !d.issue_detected).length, 'Healthy deployments'],
    ];
    cells.forEach(([cls,n,l]) => {
      const c = el('div', `stat-cell ${cls}`);
      c.innerHTML = `<div class="n">${n}</div><div class="l">${l}</div>`;
      row.append(c);
    });
    return row;
  }

  function primaryIncidentCard(sum) {
    const card = el('div','pcard');
    card.style.borderLeft = '4px solid var(--high)';
    const p = sum.primary_incident;
    if (!p) {
      card.append(el('h3','','🚨 Primary incident'));
      card.append(el('div','empty','No active incident — cluster looks calm.'));
      return card;
    }
    const sev = p.severity || 'medium';
    card.style.borderLeftColor = `var(--${sev})`;
    const headRow = el('div');
    headRow.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:8px';
    headRow.append(el('h3','','🚨 Primary incident'));
    if (p.urgency) {
      const urgIcon = ({worsening:'🔴', active:'🟠', new:'🔵', settled:'🟢'})[p.urgency] || '⚫';
      const urgLbl = ({worsening:'Worsening', active:'Active', new:'New', settled:'Settled'})[p.urgency] || p.urgency;
      headRow.append(el('span', `urg ${p.urgency}`, `${urgIcon} ${urgLbl}`));
    }
    card.append(headRow);

    // Three-tier headline
    const tier1 = el('div','h-tier1');
    tier1.innerHTML = (p.deployment_correlated ? '🚨 ' : '⚠️ ') + escapeHTML(p.human_headline || p.headline || 'Anomaly');
    card.append(tier1);
    if (p.technical_headline) card.append(el('div','h-tier2', escapeHTML(p.technical_headline)));

    const path = el('div');
    path.style.cssText = 'font-family:ui-monospace,monospace;color:var(--muted);font-size:12px;margin:8px 0 10px';
    path.textContent = wlPath(p.workload);
    card.append(path);

    if (p.short_story) {
      const s = el('div'); s.textContent = p.short_story; s.style.marginBottom='10px';
      card.append(s);
    }

    // Impact label + blast + TTD line
    const stats = el('div');
    stats.style.cssText = 'display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:8px';
    const impCls = ({low:'low', medium:'med', high:'high', critical:'crit'})[p.impact_level || 'low'] || 'low';
    const impLabel = ({low:'LOW', medium:'MEDIUM', high:'HIGH', critical:'CRITICAL'})[p.impact_level || 'low'] || 'LOW';
    stats.append(el('span', `imp-label ${impCls}`, `Impact: ${impLabel}`));
    stats.append(blastRadius(p.affected_pods, sev));
    if (p.time_to_detection_seconds) stats.append(el('span','',`⏱️ Detected ${humSecs(p.time_to_detection_seconds)} after rollout`));
    card.append(stats);

    // Before vs After mini-panel
    if (p.before_after) {
      const ba = p.before_after;
      const panel = el('div','ba-panel');
      panel.innerHTML = `
        <div class="ba-cell"><div class="l">Before</div><div class="n ${ba.before>0?'bad':'ok'}">${ba.before}</div><div class="s">errors</div></div>
        <div class="ba-cell"><div class="l">After</div><div class="n ${ba.after>0?'bad':'ok'}">${ba.after}${ba.after>ba.before?' ↑':''}</div><div class="s">errors</div></div>
        <div class="ba-change"><div class="v${ba.change_pct<0?' inf':''}">${ba.change_pct<0?'+∞%':((ba.change_pct>=0?'+':'')+ba.change_pct+'%')}</div><div class="l">change</div></div>
      `;
      card.append(panel);
    }

    if (p.confidence) {
      const conf = el('div','a-confidence');
      conf.style.marginTop = '10px';
      conf.innerHTML = `<span>Confidence</span><div class="bar"><div style="width:${p.confidence}%"></div></div><strong>${p.confidence}%</strong>`;
      card.append(conf);
    }

    // actions
    const acts = el('div');
    acts.style.cssText = 'display:flex;gap:8px;margin-top:14px';
    const view = el('button','btn primary','Investigate');
    view.onclick = () => showDetails(p.id);
    acts.append(view);
    if (p.deployment_correlated) {
      const rb = el('button','btn','Rollback');
      rb.onclick = () => showRollbackModal(p);
      acts.append(rb);
    }
    const ack = el('button','btn ghost','Mark resolved');
    ack.onclick = () => doAction(p.id, 'resolve');
    acts.append(ack);
    card.append(acts);
    return card;
  }

  function deploymentImpactCard(sum) {
    const card = el('div','deploy-card');
    card.append(el('h3','','🚀 Deployment impact'));
    card.append(el('div','sub','Last 24 hours · did this deploy break something?'));
    const list = sum.recent_deployments || [];
    if (!list.length) {
      card.append(el('div','empty','No rollouts.'));
      return card;
    }
    list.slice(0, 6).forEach(d => {
      const row = el('div','deploy-row');
      const bad = d.issue_detected;
      const dot = el('div', `dot ${bad?'bad':'ok'}`);
      const body = el('div','body');
      body.innerHTML = `<div class="name">${escapeHTML(d.workload.name)}</div><div class="sub">${fmtTime(d.when)}${d.commit?` · ${escapeHTML(d.commit.slice(0,7))}`:''} · ${escapeHTML(d.workload.namespace)}</div>`;
      const badge = el('div', `badge ${bad?'bad':'ok'}`,
        bad ? `❌ Caused ${d.caused_anomalies} ${d.caused_anomalies===1?'anomaly':'anomalies'}` : '✅ Healthy');
      row.append(dot, body, badge);
      card.append(row);
    });
    return card;
  }

  function recommendationCard(rec) {
    const card = el('div','rec-card');
    card.append(el('h3','','💡 Recommended action'));
    card.append(el('div','rec-title', escapeHTML(rec.title || 'Investigate')));
    card.append(el('div','rec-reason', escapeHTML(rec.reason || '')));
    if (rec.confidence) {
      const conf = el('div','a-confidence');
      conf.style.marginTop = '0';
      conf.innerHTML = `<span>Confidence</span><div class="bar"><div style="width:${rec.confidence}%"></div></div><strong>${rec.confidence}%</strong>`;
      card.append(conf);
    }
    if (rec.command) {
      const acts = el('div');
      acts.style.cssText = 'display:flex;gap:8px;margin-top:14px';
      const run = el('button','btn primary','Show command');
      run.onclick = () => showCommandModal(rec.title, rec.command);
      acts.append(run);
      if (rec.anomaly_id) {
        const view = el('button','btn','View incident');
        view.onclick = () => showDetails(rec.anomaly_id);
        acts.append(view);
      }
      card.append(acts);
    }
    return card;
  }

  function blastRadius(podCount, sev) {
    podCount = podCount || 1;
    const wrap = el('span', `blast ${sev==='critical'?'crit':sev==='medium'?'med':sev==='low'?'low':''}`);
    const total = 4;
    const lit = Math.min(total, Math.max(1, Math.ceil(podCount / 2)));
    for (let i = 0; i < total; i++) {
      const d = el('span', i < lit ? 'b on' : 'b');
      wrap.append(d);
    }
    const lbl = el('span', '', podCount === 1 ? '1 pod' : `${podCount} pods`);
    lbl.style.cssText = 'margin-left:6px;color:var(--muted)';
    wrap.append(lbl);
    return wrap;
  }

  function humSecs(s) {
    if (s < 60) return s + ' sec';
    if (s < 3600) return Math.round(s/60) + ' min';
    return Math.round(s/3600) + ' hr';
  }

  function showCommandModal(title, cmd) {
    const shade = el('div','modal-shade');
    const m = el('div','modal');
    m.innerHTML = `
      <h3>${escapeHTML(title)}</h3>
      <div class="rec-reason">Copy this command and run it from your shell with kubectl access. PodPulse never executes infrastructure commands automatically.</div>
      <div class="cmd">${escapeHTML(cmd)}</div>
      <div class="actions">
        <button class="btn" id="cm-copy">Copy</button>
        <button class="btn ghost" id="cm-close">Close</button>
      </div>`;
    shade.append(m);
    shade.onclick = e => { if (e.target === shade) shade.remove(); };
    document.body.append(shade);
    m.querySelector('#cm-copy').onclick = async () => {
      try { await navigator.clipboard.writeText(cmd); toast('Copied'); }
      catch(_) { toast('Copy failed — select manually'); }
    };
    m.querySelector('#cm-close').onclick = () => shade.remove();
  }

  function showRollbackModal(a) {
    const wl = a.workload;
    const cmd = `kubectl rollout undo ${(wl.kind||'deployment').toLowerCase()}/${wl.name} -n ${wl.namespace}`;
    showCommandModal(`Rollback ${wl.name}`, cmd);

  // -------------- Anomalies --------------
  async function renderAnomalies() {
    const sum = lastSummary || await api.summary();
    const data = await api.anomalies({limit: 200, severity: activeSeverity, since: '6h'});
    const m = $('#main');
    m.innerHTML = '';

    // Tabs
    const tabs = el('div','tabs');
    const allTab = el('div','tab' + (activeSeverity===''?' active':''),
      `All anomalies <span class="num">${sum.total||0}</span>`);
    allTab.onclick = () => { activeSeverity=''; rerender(); };
    tabs.append(allTab);
    [['critical','crit'],['high','high'],['medium','med'],['low','low']].forEach(([k,c]) => {
      const t = el('div',`tab ${c}` + (activeSeverity===k?' active':''),
        `<div class="dot"></div> ${k[0].toUpperCase()+k.slice(1)} <span class="num">${(sum.by_severity||{})[k]||0}</span>`);
      t.onclick = () => { activeSeverity = (activeSeverity===k?'':k); rerender(); };
      tabs.append(t);
    });
    m.append(tabs);

    // Filters row
    const fr = el('div','filters-row');
    fr.innerHTML = `
      <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Last 6 hours</div>
      <div class="pill primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18l-7 9v6l-4-2v-4z"/></svg>Filters</div>
    `;
    m.append(fr);

    // Header row
    const head = el('div');
    head.style.cssText = 'display:grid;grid-template-columns:1fr 120px 220px 180px;color:var(--muted);font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:0 18px 8px;';
    head.innerHTML = `<div>Anomaly</div><div>Severity</div><div>Impact</div><div>First seen</div>`;
    m.append(head);

    if (!data.anomalies || data.anomalies.length === 0) {
      m.append(el('div', 'empty', '<div class="pulse-dot"></div>Watching cluster heartbeat — no anomalies yet.'));
    } else {
      // Collapse low-severity unless the user expanded or filtered to "low".
      const items = data.anomalies;
      const high = items.filter(a => a.severity !== 'low');
      const low  = items.filter(a => a.severity === 'low');
      const showingLow = (activeSeverity === 'low') || showLow;

      if (high.length === 0 && low.length > 0 && !showingLow) {
        m.append(el('div','empty','No high-impact anomalies — only low-severity items, hidden by default.'));
      }
      high.forEach(a => m.append(anomalyCard(a)));

      if (!showingLow && low.length > 0) {
        const fold = el('div','low-fold',
          `${low.length} low-impact ${low.length === 1 ? 'anomaly' : 'anomalies'} hidden — click to expand`);
        fold.onclick = () => { showLow = true; lastRenderSig = null; rerender(true); };
        m.append(fold);
      } else {
        low.forEach(a => m.append(anomalyCard(a)));
      }
    }
    renderRail(sum);
  }

  function anomalyCard(a) {
    const card = el('div', `a-card sev-${sevColor(a.severity)}`);

    // Top row: tag + urgency + workload path + severity
    const top = el('div','a-top');
    const tagLabel = a.deployment_correlated ? 'NEW ERROR AFTER DEPLOY'
      : a.first_seen_in_version ? 'NEW ERROR TEMPLATE'
      : (a.kind === 'template_rate_spike' ? 'RATE SPIKE'
      : (a.kind === 'restart_rate' ? 'RESTART SPIKE' : 'NEW ANOMALY'));
    const tagCls = a.deployment_correlated ? 'a-tag deploy' : 'a-tag';
    top.append(el('span', tagCls, tagLabel));
    if (a.urgency) {
      const urgIcon = ({worsening:'🔴', active:'🟠', new:'🔵', settled:'🟢'})[a.urgency] || '⚫';
      const urgLbl = ({worsening:'Worsening', active:'Active', new:'New', settled:'Settled'})[a.urgency] || a.urgency;
      top.append(el('span', `urg ${a.urgency}`, `${urgIcon} ${urgLbl}`));
    }
    const path = el('span','a-path', escapeHTML(wlPath(a.workload)));
    top.append(path);
    const sevPill = el('span','a-sev', sevPretty(a.severity));
    top.append(sevPill);
    card.append(top);

    // Three-tier headline (human → technical → raw)
    const tier1 = el('div','h-tier1');
    const headIcon = a.deployment_correlated ? '🚨 ' : a.urgency === 'worsening' ? '📈 ' : '⚠️ ';
    tier1.innerHTML = headIcon + escapeHTML(a.human_headline || a.headline || 'New anomaly');
    if (a.first_seen_in_version) tier1.innerHTML += ' <span class="first-seen">First seen in this version</span>';
    if (a.variants && a.variants.length) tier1.innerHTML += ` <span class="first-seen">+${a.variants.length} variants</span>`;
    card.append(tier1);
    if (a.technical_headline) {
      card.append(el('div','h-tier2', escapeHTML(a.technical_headline)));
    }
    if (a.short_story) card.append(el('div','a-story', escapeHTML(a.short_story)));

    // Meta grid: impact + times
    const meta = el('div','a-meta');
    const impact = el('div','a-impact');
    // Impact: clear LOW/MEDIUM/HIGH/CRITICAL label first.
    const impCls = ({low:'low', medium:'med', high:'high', critical:'crit'})[a.impact_level || 'low'] || 'low';
    const impLabel = ({low:'LOW', medium:'MEDIUM', high:'HIGH', critical:'CRITICAL'})[a.impact_level || 'low'] || 'LOW';
    const impLine = el('div','row');
    const lbl = el('span', `imp-label ${impCls}`, `Impact: ${impLabel}`);
    impLine.append(lbl);
    if (a.impact_line) {
      impLine.append(el('span', '', ' · ' + escapeHTML(a.impact_line.replace(/^\s*/, ''))));
    }
    impact.append(impLine);
    // Blast radius dots — visual reinforcement
    const blastWrap = el('div','row');
    blastWrap.append(blastRadius(a.affected_pods || 1, a.severity));
    impact.append(blastWrap);
    if (a.time_to_detection_seconds) {
      const r = el('div','row');
      r.innerHTML = `<span>⏱️</span><span>Detected ${humSecs(a.time_to_detection_seconds)} after rollout</span>`;
      impact.append(r);
    }
    if (a.image_digest) {
      const r = el('div','row');
      r.innerHTML = `<span>🏷️</span><span style="font-family:ui-monospace,monospace;font-size:11.5px">${escapeHTML(a.image_digest.slice(0,22))}…</span>`;
      impact.append(r);
    }
    const times = el('div','a-times', `<div class="ago">${fmtTime(a.fired_at)}</div><div data-fired="${a.fired_at}">${fmtAgo(a.fired_at)}</div>`);
    meta.append(impact, times);
    card.append(meta);

    // Before vs After deployment (only when we have it)
    if (a.before_after) {
      const ba = a.before_after;
      const panel = el('div','ba-panel');
      const beforeBad = ba.before > 0;
      const afterBad = ba.after > 0;
      const beforeCell = el('div','ba-cell');
      beforeCell.innerHTML = `<div class="l">Before deployment</div><div class="n ${beforeBad?'bad':'ok'}">${ba.before}</div><div class="s">errors of this kind</div>`;
      const afterCell = el('div','ba-cell');
      afterCell.innerHTML = `<div class="l">After deployment</div><div class="n ${afterBad?'bad':'ok'}">${ba.after}${ba.after>ba.before?' ↑':''}</div><div class="s">errors of this kind</div>`;
      const ch = el('div','ba-change');
      let chTxt;
      if (ba.change_pct < 0) chTxt = '<div class="v inf">+∞%</div>';
      else if (ba.before === 0 && ba.after === 0) chTxt = '<div class="v" style="color:var(--ok)">no change</div>';
      else chTxt = `<div class="v">${ba.change_pct >= 0 ? '+' : ''}${ba.change_pct}%</div>`;
      ch.innerHTML = chTxt + `<div class="l">change</div>`;
      panel.append(beforeCell, afterCell, ch);
      card.append(panel);
    }

    // What happened narrative
    if (a.what_happened) {
      const nar = el('div','narrative');
      nar.innerHTML = `<h4>What happened</h4>${escapeHTML(a.what_happened)}` +
        (a.likely_cause ? `<div class="cause"><strong>Likely cause:</strong> ${escapeHTML(a.likely_cause)}</div>` : '');
      card.append(nar);
    }

    // Timeline
    if (a.timeline && a.timeline.length) {
      const tl = el('div','a-timeline');
      a.timeline.forEach((step, i) => {
        if (i > 0) tl.append(el('span','arrow','→'));
        const s = el('span','step');
        s.innerHTML = `<strong>${fmtTime(step.when)}</strong> ${escapeHTML(step.label)}`;
        tl.append(s);
      });
      card.append(tl);
    }

    // Confidence bar with explainable factors
    if (a.confidence) {
      const conf = el('div','a-confidence');
      const tip = (a.confidence_factors||[]).join('\n• ');
      conf.innerHTML = `<span>Confidence <span class="conf-help" title="Confidence is computed from deployment timing, novelty of the error pattern, blast radius, and rate change.${tip ? '\n• '+tip : ''}">?</span></span><div class="bar"><div style="width:${a.confidence}%"></div></div><strong>${a.confidence}%</strong>`;
      card.append(conf);
      if (a.confidence_factors && a.confidence_factors.length) {
        const ex = el('div','conf-explain');
        ex.innerHTML = `Based on:<ul>${a.confidence_factors.map(f => `<li>${escapeHTML(f)}</li>`).join('')}</ul>`;
        card.append(ex);
      }
    }

    // Chips
    const chips = el('div','a-chips');
    chips.innerHTML = `
      <span class="a-chip"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg><code>id: ${escapeHTML(a.id.slice(0,16))}…</code></span>
    `;
    if (a.variants && a.variants.length) {
      const v = el('span','a-chip variants', `+${a.variants.length} similar variants`);
      chips.append(v);
    }
    card.append(chips);

    // Actions
    const acts = el('div','a-actions');
    const view = el('button','btn primary','Investigate');
    view.onclick = () => showDetails(a.id);
    acts.append(view);
    if (a.deployment_correlated) {
      const rb = el('button','btn','Rollback');
      rb.onclick = () => showRollbackModal(a);
      acts.append(rb);
    }
    const silence = el('button','btn','Silence');
    silence.onclick = () => doAction(a.id, 'silence');
    const resolve = el('button','btn','Mark resolved');
    resolve.onclick = () => doAction(a.id, 'resolve');
    const ignore = el('button','btn ghost','Ignore');
    ignore.onclick = () => doAction(a.id, 'ignore');
    acts.append(silence, resolve, ignore);
    card.append(acts);

    // Next steps — numbered thinking guide instead of command dump
    if (a.suggestions && a.suggestions.length) {
      const steps = el('div','steps');
      steps.append(el('h4','','Next steps'));
      a.suggestions.slice(0, 3).forEach((s, i) => {
        const row = el('div','step');
        row.append(el('div','step-num', String(i + 1)));
        const body = el('div','step-body');
        body.innerHTML = `<div class="t">${escapeHTML(s.title)}</div>${s.command?'<code>'+escapeHTML(s.command)+'</code>':''}${s.why?'<div class="why">'+escapeHTML(s.why)+'</div>':''}`;
        row.append(body);
        steps.append(row);
      });
      if (a.suggestions.length > 3) {
        steps.append(el('div','why', `+${a.suggestions.length-3} more in details`));
      }
      card.append(steps);
    }

    return card;
  }

  async function doAction(id, action) {
    try {
      await api.setState(id, action);
      toast(`${action[0].toUpperCase()+action.slice(1)}d`);
      tick();
    } catch (e) {
      toast('Failed: ' + e.message);
    }
  }

  async function showDetails(id) {
    try {
      const a = await api.anomaly(id);
      const overlay = el('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:grid;place-items:center;padding:30px;';
      const card = anomalyCard(a);
      card.style.cssText = 'max-width:760px;width:100%;max-height:80vh;overflow-y:auto;';
      // Show ALL suggestions in the modal.
      const sug = card.querySelector('.a-suggestions');
      if (sug && a.suggestions && a.suggestions.length > 2) {
        sug.innerHTML = '<h4>Suggested investigation</h4>';
        a.suggestions.forEach(s => {
          const box = el('div','a-sug');
          box.innerHTML = `<div class="t">${escapeHTML(s.title)}</div>${s.command?'<code>'+escapeHTML(s.command)+'</code>':''}${s.why?'<div class="why">'+escapeHTML(s.why)+'</div>':''}`;
          sug.append(box);
        });
      }
      // Add raw template + sample
      const detail = el('div', 'a-suggestions');
      detail.innerHTML = `<h4>Raw template</h4><div class="a-sug"><code>${escapeHTML(a.template||'')}</code></div>`;
      if (a.sample && a.sample.length) {
        detail.innerHTML += `<h4 style="margin-top:10px;">Sample line (redacted)</h4><div class="a-sug"><code>${escapeHTML(a.sample[0])}</code></div>`;
      }
      card.append(detail);
      overlay.append(card);
      overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
      document.body.append(overlay);
    } catch(e) { toast('Failed: ' + e.message); }
  }

  // -------------- Right rail --------------
  function renderRail(sum) {
    if (!sum) return;
    const rail = $('#rail');
    rail.innerHTML = '';

    // Incident summary
    const inc = el('div','card');
    inc.innerHTML = `<h3>Incident summary</h3><div class="sub">Since last 6 hours</div>`;
    const totLine = el('div','total-line');
    totLine.innerHTML = `<div class="big">${sum.total||0}</div><div class="lbl">total anomalies</div>`;
    inc.append(totLine);
    inc.append(sparkline(sum.sparkline));
    inc.append(sevBar(sum.by_severity));
    rail.append(inc);

    // Top workloads
    const tw = el('div','card');
    tw.innerHTML = `<h3>Top workloads</h3><div class="sub">By affected pods</div>`;
    if (!sum.top_workloads || !sum.top_workloads.length) {
      tw.append(el('div','sub','No anomalies in window'));
    } else {
      sum.top_workloads.forEach(w => {
        const r = el('div','row');
        const max = Math.max(1, ...sum.top_workloads.map(x => x.affected_pods || x.anomaly_count || 1));
        const pct = Math.max(8, Math.round(100 * (w.affected_pods || w.anomaly_count) / max));
        r.innerHTML = `<div style="flex:1;min-width:0;"><div class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(w.workload.name)}</div><div style="height:4px;background:var(--panel-2);border-radius:2px;margin-top:6px;"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;"></div></div></div><div class="num">${w.affected_pods || w.anomaly_count}</div>`;
        tw.append(r);
      });
    }
    rail.append(tw);

    // Recent deployments
    const rd = el('div','card');
    rd.innerHTML = `<h3>Recent deployments</h3><div class="sub">Last 24 hours</div>`;
    if (!sum.recent_deployments || !sum.recent_deployments.length) {
      rd.append(el('div','sub','No rollouts'));
    } else {
      sum.recent_deployments.forEach(d => {
        const r = el('div','row');
        const tag = d.issue_detected
          ? `<span style="color:var(--high);font-size:11px;background:rgba(255,138,61,.12);padding:2px 7px;border-radius:4px;">⚠ Caused issues</span>`
          : `<span style="color:var(--ok);font-size:11px;background:rgba(105,209,153,.10);padding:2px 7px;border-radius:4px;">✓ No issues</span>`;
        r.innerHTML = `<div style="flex:1;min-width:0;"><div class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(d.workload.name)}</div><div class="meta">${fmtTime(d.when)}${d.commit?` · ${escapeHTML(d.commit.slice(0,7))}`:''}</div></div>${tag}`;
        rd.append(r);
      });
    }
    rail.append(rd);

    // Recommendations
    if (sum.recommendations && sum.recommendations.length) {
      const r = el('div','card');
      r.innerHTML = `<h3>💡 Recommended actions</h3>`;
      sum.recommendations.forEach((t, i) => r.append(el('div','row',`<div class="name">${i+1}. ${escapeHTML(t)}</div>`)));
      rail.append(r);
    }
  }

  function sevBar(by) {
    by = by || {};
    const wrap = el('div','sev-bar');
    wrap.innerHTML = `
      <div class="sev-cell crit"><div class="n">${by.critical||0}</div><div class="l">Critical</div></div>
      <div class="sev-cell high"><div class="n">${by.high||0}</div><div class="l">High</div></div>
      <div class="sev-cell med"><div class="n">${by.medium||0}</div><div class="l">Medium</div></div>
      <div class="sev-cell low"><div class="n">${by.low||0}</div><div class="l">Low</div></div>
    `;
    return wrap;
  }

  function sparkline(points) {
    points = points || [];
    if (!points.length) return el('div');
    const max = Math.max(1, ...points.map(p => p.count));
    const w = 280, h = 50;
    const stepX = w / (points.length - 1 || 1);
    const path = points.map((p, i) => {
      const x = i * stepX;
      const y = h - (p.count / max) * h;
      return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const area = path + ` L${w},${h} L0,${h} Z`;
    const svg = el('div');
    svg.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="50" style="margin-top:10px;display:block;"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d6d" stop-opacity=".4"/><stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#sg)" /><path d="${path}" stroke="#ff4d6d" stroke-width="1.5" fill="none"/></svg>`;
    return svg;
  }

  // -------------- toast --------------
  function toast(msg) {
    const t = el('div','toast', escapeHTML(msg));
    document.body.append(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2200);
  }
</script>

</body>
</html>
