# fly.io launch config for the public demo.
# Deploys the podpulse-demo single-process binary (detector + synthetic
# tailer) on a 1-vCPU shared-memory machine. Free tier friendly.

app = "podpulse-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.demo"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # The detector serves HTTPS itself with a self-signed cert; fly's
  # edge proxy talks to it over plain HTTP via h2c using internal
  # routing — that's why force_https handles the user-facing TLS.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
